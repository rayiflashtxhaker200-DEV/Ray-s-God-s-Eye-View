<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ray's Eye View</title>
    <meta
      name="description"
      content="Ray's Eye View — Consola geoespacial 3D en tiempo real con globo fotorrealista, capas en vivo y control remoto móvil por código QR."
    />
    <meta property="og:title" content="Ray's Eye View" />
    <meta
      property="og:description"
      content="Consola geoespacial 3D minimalista y adaptable con control remoto móvil por código QR, trackpad táctil y búsqueda en vivo."
    />
    <!-- Raster icons & fallbacks: Safari ignores an SVG apple-touch-icon and falls back
       to a screenshot of the page, so an installed app needs a real PNG. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" href="/assets/aistudio/RayXico64_8d7ad9b6.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#030505" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Ray's Eye View" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Icon font subset to the glyphs this app renders. Keep `icon_names` in sync
       with the sources: src/materialSymbolsSubset.test.mjs fails when a source
       names a glyph this list is missing, because a missing glyph does not draw
       a box — the ligature never forms and the element renders the literal word. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=add,adjust,apartment,arrow_drop_down,arrow_forward,arrow_left,arrow_right,auto_awesome,bolt,chat,check,chevron_left,chevron_right,close,close_fullscreen,dark_mode,delete,devices,draw,east,expand_more,flare,flight,handyman,key,layers,layers_clear,light_mode,local_fire_department,location_on,lock,logout,mic,mic_off,more_horiz,movie,my_location,navigation,normal,on,open_in_full,partly_cloudy_day,pause,pentagon,play_arrow,public,qr_code_2,radar,radio,remove,right_panel_close,right_panel_open,rocket_launch,satellite_alt,search,send,settings,skip_next,skip_previous,smartphone,stop,stop_circle,streetview,sync,timeline,touch_app,tune,upload_file,verified_user,videocam,view_in_ar,visibility,visibility_off,volume_off,volume_up"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="gev-view" data-gev-view="scene-chrome"></div>
    <div class="gev-view" data-gev-view="cockpit"></div>
    <div class="gev-view" data-gev-view="display-controls"></div>
    <div class="gev-view" data-gev-view="command-dock"></div>
    <div class="gev-view" data-gev-view="layer-panels"></div>
    <div class="gev-view" data-gev-view="context"></div>
    <div class="gev-view" data-gev-view="welcome"></div>
    <div class="gev-view" data-gev-view="provider-settings"></div>
    <!-- Intelligence HUD Overlay -->
    <div class="gev-view" data-gev-view="intel-hud"></div>

    <!-- Loading screen -->
    <div id="loading-screen">
      <div class="loader-content">
        <span class="loader-logo brand-logo" aria-hidden="true"
          ><img src="/assets/aistudio/RayXico64_8d7ad9b6.png" alt=""
        /></span>
        <h2 translate="no">RAY'S EYE <span class="title-accent">VIEW</span></h2>
        <p class="loader-status" data-i18n>
          Initializing photorealistic world...
        </p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
